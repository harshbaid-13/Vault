<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Shopping list · My Vault</title>
<link rel="stylesheet" href="../static/css/app.css">
<script src="../static/js/app.js" defer></script>
</head>
<body class="app app--no-tabbar">
<a class="skip-link" href="#main">Skip to content</a>
<nav class="sidebar" aria-label="Sections">
  <p class="sidebar__mark">My Vault</p>
  <button class="btn btn--primary sidebar__upload" type="button" data-upload><span class="icon icon--upload icon--sm" aria-hidden="true"></span>Upload</button>
  <ul class="sidebar__list">
    <li><a class="sidebar__link" href="home.html"><span class="icon icon--house icon--sm" aria-hidden="true"></span>Home</a></li>
    <li><a class="sidebar__link" href="files.html"><span class="icon icon--folder icon--sm" aria-hidden="true"></span>Files</a></li>
    <li><a class="sidebar__link" href="photos.html"><span class="icon icon--image icon--sm" aria-hidden="true"></span>Photos</a></li>
    <li><a class="sidebar__link sidebar__link--active" href="notes.html" aria-current="page"><span class="icon icon--file-text icon--sm" aria-hidden="true"></span>Notes</a></li>
    <li><a class="sidebar__link" href="clipboard.html"><span class="icon icon--clipboard icon--sm" aria-hidden="true"></span>Clipboard</a></li>
    <li><a class="sidebar__link" href="links.html"><span class="icon icon--link icon--sm" aria-hidden="true"></span>Links</a></li>
    <li><a class="sidebar__link" href="favorites.html"><span class="icon icon--star icon--sm" aria-hidden="true"></span>Favorites</a></li>
  </ul>
  <ul class="sidebar__list sidebar__foot">
    <li><a class="sidebar__link" href="settings.html"><span class="icon icon--settings icon--sm" aria-hidden="true"></span>Settings</a></li>
    <li><a class="sidebar__link" href="login.html"><span class="icon icon--log-out icon--sm" aria-hidden="true"></span>Log out</a></li>
  </ul>
</nav>
<div class="app__main">
<header class="topbar">
  <a class="icon-btn topbar__back" href="notes.html" aria-label="Back to Notes"><span class="icon icon--chevron-left" aria-hidden="true"></span></a>
  <h1 class="topbar__title">Notes</h1>
  
  <div class="topbar__actions"><button class="icon-btn star" type="button" data-star data-name="Shopping list" aria-pressed="true" aria-label="Unfavorite Shopping list"><span class="icon" aria-hidden="true"></span></button><button class="icon-btn" type="button" data-sheet-open="sheet-note-edit" aria-haspopup="dialog" aria-label="Note actions"><span class="icon icon--ellipsis" aria-hidden="true"></span></button></div>
</header>
<main class="page" id="main">
<form class="editor" data-autosave>
  <label class="visually-hidden" for="note-title">Title</label>
  <input class="editor__title" id="note-title" type="text" value="Shopping list" autocomplete="off">
  <p class="editor__status" data-autosave-status>Saved · Yesterday, 18:02</p>
  <label class="visually-hidden" for="note-body">Note</label>
  <textarea class="editor__body" id="note-body" placeholder="Start writing…">
milk
bread
coffee
eggs
tomatoes, onions
dish soap
batteries (AA)</textarea>
</form>
</main>
</div>


<div class="toast-region" aria-live="polite"><div class="toast"><span class="icon icon--check icon--sm toast__icon" aria-hidden="true"></span><span class="toast__text"></span></div></div>
<dialog class="sheet" id="sheet-more" aria-labelledby="sheet-more-title">
  <span class="sheet__handle" aria-hidden="true"></span>
  <p class="sheet__title" id="sheet-more-title">More</p>
  <ul class="sheet__list">
    <li><a class="sheet__item" href="photos.html"><span class="icon icon--image icon--sm" aria-hidden="true"></span>Photos</a></li>
    <li><a class="sheet__item" href="notes.html"><span class="icon icon--file-text icon--sm" aria-hidden="true"></span>Notes</a></li>
    <li><a class="sheet__item" href="links.html"><span class="icon icon--link icon--sm" aria-hidden="true"></span>Links</a></li>
    <li><a class="sheet__item" href="favorites.html"><span class="icon icon--star icon--sm" aria-hidden="true"></span>Favorites</a></li>
    <li><a class="sheet__item" href="settings.html"><span class="icon icon--settings icon--sm" aria-hidden="true"></span>Settings</a></li>
    <li><a class="sheet__item" href="login.html"><span class="icon icon--log-out icon--sm" aria-hidden="true"></span>Log out</a></li>
  </ul>
  <button class="sheet__cancel" type="button" data-close>Cancel</button>
</dialog>
<dialog class="sheet" id="sheet-note-edit" aria-labelledby="sheet-note-edit-title">
  <span class="sheet__handle" aria-hidden="true"></span>
  <p class="sheet__title" id="sheet-note-edit-title">Shopping list</p>
  <ul class="sheet__list">
    <li><button class="sheet__item" type="button" data-action="copy" data-copy-from="#note-body"><span class="icon icon--copy icon--sm" aria-hidden="true"></span>Copy all</button></li>
    <li><button class="sheet__item" type="button" data-action="toast" data-toast="Added to Favorites"><span class="icon icon--star icon--sm" aria-hidden="true"></span>Favorite</button></li>
    <li><button class="sheet__item sheet__item--danger" type="button" data-action="delete"><span class="icon icon--trash icon--sm" aria-hidden="true"></span>Delete</button></li>
  </ul>
  <button class="sheet__cancel" type="button" data-close>Cancel</button>
</dialog>
<dialog class="modal" id="modal-delete" aria-labelledby="modal-delete-title" aria-describedby="modal-delete-body">
  <h2 class="modal__title" id="modal-delete-title">Delete this item?</h2>
  <p class="modal__body" id="modal-delete-body">This cannot be undone.</p>
  <div class="modal__actions">
    <button class="btn btn--secondary" type="button" data-close autofocus>Cancel</button>
    <button class="btn btn--danger" type="button" data-action="confirm-delete">Delete</button>
  </div>
</dialog>
</body>
</html>
