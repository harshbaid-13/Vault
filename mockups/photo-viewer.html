<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Photo · My Vault</title>
<link rel="stylesheet" href="../static/css/app.css">
<script src="../static/js/app.js" defer></script>
</head>
<body class="viewer">
<div class="viewer__bar viewer-chrome">
  <a class="icon-btn icon-btn--on-dark" href="photos.html" data-viewer-back aria-label="Back to Photos"><span class="icon icon--chevron-left" aria-hidden="true"></span></a>
  <div>
    <button class="icon-btn icon-btn--on-dark star" type="button" data-star data-name="this photo" aria-pressed="false" aria-label="Favorite this photo"><span class="icon" aria-hidden="true"></span></button>
    <button class="icon-btn icon-btn--on-dark" type="button" data-sheet-open="sheet-photo" aria-haspopup="dialog" aria-label="Photo actions"><span class="icon icon--ellipsis" aria-hidden="true"></span></button>
  </div>
</div>

<button class="icon-btn icon-btn--on-dark viewer__nav viewer__nav--prev viewer-chrome desktop-only" type="button" data-viewer-step="-1" aria-label="Previous photo"><span class="icon icon--chevron-left" aria-hidden="true"></span></button>
<button class="icon-btn icon-btn--on-dark viewer__nav viewer__nav--next viewer-chrome desktop-only" type="button" data-viewer-step="1" aria-label="Next photo"><span class="icon icon--chevron-right" aria-hidden="true"></span></button>
<div class="toast-region" aria-live="polite"><div class="toast"><span class="icon icon--check icon--sm toast__icon" aria-hidden="true"></span><span class="toast__text"></span></div></div>
<dialog class="sheet" id="sheet-photo" aria-labelledby="sheet-photo-title">
  <span class="sheet__handle" aria-hidden="true"></span>
  <p class="sheet__title" id="sheet-photo-title">IMG_20260914_091532.jpg</p>
  <ul class="sheet__list">
    <li><button class="sheet__item" type="button" data-action="toast" data-toast="Downloading…"><span class="icon icon--download icon--sm" aria-hidden="true"></span>Download</button></li>
    <li><button class="sheet__item" type="button" data-action="toast" data-toast="Renamed"><span class="icon icon--pencil icon--sm" aria-hidden="true"></span>Rename</button></li>
    <li><button class="sheet__item sheet__item--danger" type="button" data-action="delete"><span class="icon icon--trash icon--sm" aria-hidden="true"></span>Delete</button></li>
  </ul>
  <button class="sheet__cancel" type="button" data-close>Cancel</button>
</dialog>
<dialog class="modal" id="modal-delete" aria-labelledby="modal-delete-title" aria-describedby="modal-delete-body">
  <h2 class="modal__title" id="modal-delete-title">Delete this item?</h2>
  <p class="modal__body" id="modal-delete-body">This cannot be undone.</p>
  <div class="modal__actions">
    <button class="btn btn--secondary" type="button" data-close autofocus>Cancel</button>
    <button class="btn btn--danger" type="button" data-action="confirm-delete">Delete</button>
  </div>
</dialog>
</body>
</html>
