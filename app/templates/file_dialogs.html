{#- The move picker and the Rename modal, shared by the Files page and the preview page. -#}
{% from "macros.html" import icon with context %}
<dialog class="sheet picker" id="sheet-move" aria-labelledby="picker-title">
  <span class="sheet__handle" aria-hidden="true"></span>
  <p class="sheet__title" data-picker-what>Move</p>
  <div class="picker__head">
    <button class="icon-btn" type="button" data-picker-up aria-label="Up one folder">{{ icon("chevron-left") }}</button>
    <h2 class="picker__title" id="picker-title" data-picker-title>Files</h2>
  </div>
  <ul class="sheet__list picker__list" data-picker-list></ul>
  <p class="picker__empty" data-picker-empty hidden>No folders in here.</p>
  <div class="picker__actions">
    <button class="btn btn--secondary" type="button" data-close>Cancel</button>
    <button class="btn btn--primary" type="button" data-picker-confirm>Move here</button>
  </div>
</dialog>
<dialog class="modal" id="modal-rename" aria-labelledby="modal-rename-title">
  <form class="modal__form" data-rename-form novalidate>
    <h2 class="modal__title" id="modal-rename-title">Rename</h2>
    <div class="field">
      <label class="visually-hidden" for="rename-name">New name</label>
      <input class="input" id="rename-name" name="name" type="text" maxlength="255" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    </div>
    <p class="field__error" data-rename-error aria-live="polite"></p>
    <div class="modal__actions">
      <button class="btn btn--secondary" type="button" data-close>Cancel</button>
      <button class="btn btn--primary" type="submit">Rename</button>
    </div>
  </form>
</dialog>
